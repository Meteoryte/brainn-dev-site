name: Smoke Test

on:
  pull_request:

jobs:
  smoke:
    name: RegistryRouter smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run smoke test
        run: npm run registryrouter:smoke

      - name: Validate catalog
        run: npm run registryrouter:validate
